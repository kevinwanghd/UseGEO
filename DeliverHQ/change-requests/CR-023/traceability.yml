schema: deliverhq-traceability
version: 1

CR-023:
  requirement: "Commercial Conversion Layer"
  priority: "P0"
  acceptance_criteria:
    - "Three commercial routes return 200"
    - "Homepage commercial module exists"
    - "Consent and no fake ranking copy are present"
    - "Partner and sponsor offer definitions are present"
  implementation:
    - file: "wordpress/theme/usegeo/functions.php"
      type: "theme-code"
    - file: "wordpress/theme/usegeo/inc/commercial-pages.php"
      type: "theme-code"
    - file: "wordpress/theme/usegeo/front-page.php"
      type: "theme-code"
    - file: "wordpress/theme/usegeo/template-parts/conversion/commercial-loop.php"
      type: "theme-code"
    - file: "wordpress/theme/usegeo/assets/css/homepage.css"
      type: "theme-code"
    - file: "wordpress/theme/usegeo/assets/css/base.css"
      type: "theme-code"
    - file: "DeliverHQ/change-requests/CR-023/evidence/verify_commercial_conversion.py"
      type: "verification"
  tests:
    - file: "DeliverHQ/change-requests/CR-023/evidence/verify_commercial_conversion.py"
      cases:
        - name: "commercial conversion acceptance"
          covers: "routes, homepage module, consent, sample report, partner offer"
          type: "static-and-production-verification"
  verification:
    - gate: "SpecGate"
      status: "planned"
    - gate: "PreDevGate"
      status: "planned"
    - gate: "LocalVerifier"
      status: "planned"
