schema: deliverhq-traceability
version: 1

CR-016:
  requirement: "Create UseGEO distribution launch templates, social drafts, community drafts, and partner outreach assets"
  priority: "P1"
  acceptance_criteria:
    - "Each sample article has 3 LinkedIn drafts covering pov/checklist/before_after"
    - "Each sample article has 5 X/Twitter drafts and at least 1 scanner CTA"
    - "Community drafts avoid hard sell and direct spam links"
    - "Partner prospect list has at least 20 targets and tracking fields"
    - "Outreach template has cold email and DM variants"
    - "No external post/email/DM is sent"
