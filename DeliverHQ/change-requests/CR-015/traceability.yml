  tests:
    - file: "DeliverHQ/change-requests/CR-015/evidence/verify_use_case_geo.py"
      cases:
        - name: "local use-case GEO content acceptance"
          covers: "word count, FAQ, CTA, links, use-case markers, forbidden claims, secret patterns"
          type: "content-verification"
        - name: "production use-case GEO content acceptance"
          covers: "HTTP 200 and production HTML checks"
          type: "production-verification"
    - file: "DeliverHQ/change-requests/CR-015/evidence/publish_use_case_geo.mjs"
      cases:
        - name: "WordPress REST create/update use-case posts"
          covers: "create missing posts and avoid duplicate slugs"
          type: "production-publish"
  verification:
    - gate: "SpecGate"
      status: "PASS"
    - gate: "DesignGate"
      status: "PASS"
    - gate: "PreDevGate"
      status: "PASS"
    - gate: "ProductionVerifier"
      status: "PASS"
