schema: deliverhq-traceability
version: 1

CR-015:
  requirement: "Publish five GEO Use Case Cluster articles following CR-012 content template"
  priority: "P1"
  acceptance_criteria:
    - "5 production URLs return HTTP 200"
    - "Each article has 1200-1800 English words"
    - "Each article has FAQ >=4, Scanner CTA >=1, internal links >=3"
    - "Each article includes its use-case-specific required markers"
    - "Forbidden AI-ranking / UseGEO self-service claims are absent"
    - "No production secrets are committed"
  implementation:
