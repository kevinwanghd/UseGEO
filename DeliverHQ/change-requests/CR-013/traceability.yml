          covers: "word count, FAQ, CTA, links, topic markers, forbidden claims, secret patterns"
          type: "content-verification"
        - name: "production tactical GEO content acceptance"
          covers: "HTTP 200 and production HTML checks"
          type: "production-verification"
    - file: "DeliverHQ/change-requests/CR-013/evidence/publish_tactical_geo.mjs"
      cases:
        - name: "WordPress REST create/update tactical posts"
          covers: "create missing posts and avoid duplicate slugs"
          type: "production-publish"
