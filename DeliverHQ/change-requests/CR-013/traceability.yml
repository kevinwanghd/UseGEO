schema: deliverhq-traceability
version: 1

CR-013:
  requirement: "Publish five Tactical GEO Cluster articles following CR-012 content template"
  priority: "P1"
  acceptance_criteria:
    - "5 production URLs return HTTP 200"
    - "Each article has 1200-1800 English words"
    - "Each article has FAQ >=4, Scanner CTA >=1, internal links >=3"
    - "Each article includes its topic-specific required markers"
    - "Forbidden AI-ranking / schema-direct-recommendation / SEO-is-dead claims are absent"
    - "No production secrets are committed"
