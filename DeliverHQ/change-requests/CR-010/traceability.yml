schema: deliverhq-traceability
version: 1

CR-010:
  requirement: "Expand three UseGEO money pages into long-form SEO/GEO commercial guides"
  priority: "P0"
  acceptance_criteria:
    - "Each page has 2500-3500 English words"
    - "Each page has at least 5 FAQ items"
    - "Each page has at least 2 Scanner CTAs"
    - "Each page links to the other two money pages"
    - "Forbidden AI-ranking and self-operated service claims are absent"
    - "Production URLs return HTTP 200 and contain the new content"
  implementation:
    - file: "DeliverHQ/change-requests/CR-010/request.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/acceptance-spec.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/context-summary.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/implementation-plan.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/test-plan.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/human-decisions.md"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/design/metadata.yml"
      type: "design-doc"
    - file: "DeliverHQ/change-requests/CR-010/design/design-decisions.md"
      type: "design-doc"
    - file: "DeliverHQ/change-requests/CR-010/design/lo-fi-spec.md"
      type: "design-doc"
    - file: "DeliverHQ/change-requests/CR-010/design/hi-fi-spec.md"
      type: "design-doc"
    - file: "DeliverHQ/change-requests/CR-010/traceability.yml"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/verification-manifest.yml"
      type: "verification-config"
    - file: "DeliverHQ/change-requests/CR-010/goal-contract.yml"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/plan.yml"
      type: "cr-doc"
    - file: "DeliverHQ/change-requests/CR-010/outputs/geo-checklist-expanded.html"
      type: "content"
    - file: "DeliverHQ/change-requests/CR-010/outputs/ai-visibility-tools-expanded.html"
      type: "content"
    - file: "DeliverHQ/change-requests/CR-010/outputs/best-geo-agencies-expanded.html"
      type: "content"
    - file: "DeliverHQ/change-requests/CR-010/evidence/verify_money_pages.py"
      type: "verification"
    - file: "DeliverHQ/change-requests/CR-010/evidence/money-pages-local-result.json"
      type: "evidence"
  tests:
    - file: "DeliverHQ/change-requests/CR-010/evidence/verify_money_pages.py"
      cases:
        - name: "local content acceptance"
          covers: "word count, FAQ count, Scanner CTAs, internal links, forbidden claims, secret patterns"
          type: "content-verification"
    - file: "DeliverHQ/change-requests/CR-010/evidence/verify_money_pages.py"
      cases:
        - name: "production content acceptance"
          covers: "HTTP 200 and production HTML content checks"
          type: "production-verification"
  verification:
    - gate: "SpecGate"
      status: "PASS"
    - gate: "DesignGate"
      status: "PASS"
    - gate: "PreDevGate"
      status: "PASS"
    - gate: "ReviewGate"
      status: "pending"
    - gate: "QualityGate"
      status: "pending"
    - gate: "WritebackGate"
      status: "pending"
