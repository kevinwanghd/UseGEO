  tests:
    - file: "DeliverHQ/change-requests/CR-014/evidence/verify_commercial_geo.py"
      cases:
        - name: "local commercial GEO content acceptance"
          covers: "word count, FAQ, CTA, links, commercial markers, forbidden claims, secret patterns"
          type: "content-verification"
        - name: "production commercial GEO content acceptance"
          covers: "HTTP 200 and production HTML checks"
          type: "production-verification"
    - file: "DeliverHQ/change-requests/CR-014/evidence/publish_commercial_geo.mjs"
      cases:
        - name: "WordPress REST create/update commercial posts"
          covers: "create missing posts and avoid duplicate slugs"
          type: "production-publish"
  verification:
