schema: deliverhq-traceability
version: 1

CR-014:
  requirement: "Publish five Tools & Commercial Cluster articles following CR-012 content template"
  priority: "P1"
  acceptance_criteria:
    - "5 production URLs return HTTP 200"
    - "Each article has 1200-1800 English words"
    - "Each article has FAQ >=4, Scanner CTA >=1, internal links >=3"
    - "Commercial trust requirements are met: no fake rankings, no single-tool bias, careful measurement wording, partner lead angle"
    - "Forbidden AI-ranking / precise ChatGPT tracking / UseGEO self-service claims are absent"
    - "No production secrets are committed"
  implementation:
