schema: deliverhq-traceability
version: 1

CR-011:
  requirement: "Publish five GEO Basics Cluster articles and route readers to Scanner/money pages"
  priority: "P0"
  acceptance_criteria:
    - "5 production URLs return HTTP 200"
    - "Each article has 1200-1800 English words"
    - "Each article has Quick answer, FAQ, common mistakes/checklist"
    - "Each article has at least 1 Scanner CTA and at least 2 internal links"
    - "Forbidden AI-ranking / precise tracking claims are absent"
    - "No production secrets are committed"
