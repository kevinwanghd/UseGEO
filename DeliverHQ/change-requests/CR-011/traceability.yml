  tests:
    - file: "DeliverHQ/change-requests/CR-011/evidence/verify_geo_basics.py"
      cases:
        - name: "local GEO basics content acceptance"
          covers: "word count, FAQ, CTA, internal links, forbidden claims, secret patterns"
          type: "content-verification"
        - name: "production GEO basics content acceptance"
          covers: "HTTP 200 and production HTML content checks"
          type: "production-verification"
    - file: "DeliverHQ/change-requests/CR-011/evidence/publish_geo_basics.mjs"
      cases:
        - name: "WordPress REST publish/update existing slugs"
          covers: "update existing posts, create missing posts, avoid duplicate slugs"
          type: "production-publish"
  verification:
    - gate: "SpecGate"
      status: "PASS"
    - gate: "DesignGate"
      status: "PASS"
    - gate: "PreDevGate"
      status: "PASS"
    - gate: "ProductionVerifier"
      status: "PASS"
